<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FolderSnap report</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background:#0d1519; color:#e8f1ed; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:radial-gradient(circle at 15% 0,#17312e 0,transparent 35%),#0d1519; }
    header, main { width:min(1180px,calc(100% - 32px)); margin:auto; }
    header { padding:30px 0 18px; }
    h1 { margin:5px 0; font-size:clamp(24px,4vw,38px); letter-spacing:-.04em; }
    .eyebrow { color:#94e6c6; font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    .summary { color:#aebfba; display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; }
    .toolbar { position:sticky; top:0; z-index:4; display:grid; grid-template-columns:minmax(180px,1fr) repeat(3,auto); gap:8px; padding:10px; border:1px solid #314146; border-radius:11px; background:#142126ee; backdrop-filter:blur(14px); }
    input, select { min-height:34px; border:1px solid #3b4d51; border-radius:7px; padding:0 10px; background:#0f1a1e; color:#e8f1ed; font:inherit; }
    input:focus, select:focus { outline:2px solid #94e6c6; outline-offset:1px; }
    #tree { margin:12px 0 26px; border:1px solid #2d3d42; border-radius:11px; overflow:hidden; background:#111c21; }
    details { border-top:1px solid #26363b; }
    details:first-child { border-top:0; }
    summary { position:relative; cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    summary::before { content:"›"; position:absolute; left:12px; top:50%; width:12px; color:#94e6c6; font-size:17px; line-height:1; transform:translateY(-50%) rotate(0); transition:transform .12s; }
    details[open] > summary::before { transform:translateY(-50%) rotate(90deg); }
    .row { min-height:40px; display:grid; grid-template-columns:minmax(220px,1fr) 95px minmax(145px,auto) 155px auto; align-items:center; gap:10px; padding:6px 12px; border-top:1px solid #26363b; }
    summary.row { padding-left:36px; }
    .row:hover { background:#1a292d; }
    .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; line-height:1.15; }
    .path { display:block; margin-top:2px; color:#879b96; font-size:9px; font-weight:400; overflow:hidden; text-overflow:ellipsis; }
    .meta { color:#afc0bb; font-size:11px; white-space:nowrap; }
    .row .name { grid-column:1; }
    .row .type { grid-column:2; }
    .row .size { grid-column:3; }
    .row .date { grid-column:4; }
    .row .badge { grid-column:5; }
    .badge { justify-self:start; border:1px solid #526267; border-radius:999px; padding:2px 7px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .status-added { background:#173c31; border-left:4px solid #73d7ad; }
    .status-removed { background:#3a2025; border-left:4px solid #ef8992; }
    .status-modified { background:#3a3420; border-left:4px solid #e8c56f; }
    .status-warning { background:#332b3d; border-left:4px solid #c0a2ef; }
    .children { margin-left:16px; border-left:1px solid #324348; }
    .empty { padding:34px 18px; text-align:center; color:#8ea19c; }
    #warnings { margin:0 0 28px; }
    .warning { padding:8px 11px; margin-top:7px; border:1px solid #6a5930; border-radius:7px; background:#332d1d; color:#ead08a; font-size:12px; }
    footer { padding:0 0 26px; color:#71847f; font-size:10px; }
    @media (max-width:800px) {
      .toolbar { grid-template-columns:1fr 1fr; }
      .toolbar input { grid-column:1/-1; }
      .row { grid-template-columns:minmax(150px,1fr) auto; gap:7px; padding:6px 10px; }
      .row .type, .row .date { display:none; }
      .row .name { grid-column:1; grid-row:1; }
      .row .size { grid-column:2; grid-row:1; }
      .row .badge { grid-column:2; grid-row:2; }
      summary.row { padding-left:32px; }
    }
  </style>
</head>
<body>
  <script id="foldersnap-data" type="application/json">/* FOLDERSNAP_REPORT_DATA */</script>
  <header>
    <div class="eyebrow">FolderSnap · Offline metadata report</div>
    <h1 id="title">FolderSnap report</h1>
    <div class="summary" id="summary" aria-live="polite"></div>
  </header>
  <main>
    <section class="toolbar" aria-label="Report controls">
      <input id="search" type="search" placeholder="Search name or path" aria-label="Search report">
      <select id="filter" aria-label="Change filter">
        <option value="all">All changes</option>
        <option value="added">Added</option>
        <option value="removed">Deleted</option>
        <option value="modified">Modified</option>
        <option value="warning">Warnings</option>
      </select>
      <select id="sort" aria-label="Sort field">
        <option value="name">Name</option>
        <option value="size">Size</option>
        <option value="created">Creation date</option>
      </select>
      <select id="direction" aria-label="Sort direction">
        <option value="asc">Ascending</option>
        <option value="desc" selected>Descending</option>
      </select>
    </section>
    <section id="tree" aria-label="Folder tree"></section>
    <section id="warnings" aria-label="Snapshot warnings"></section>
    <footer>Generated locally by FolderSnap. This report contains metadata only and makes no network requests.</footer>
  </main>
  <script>
    "use strict";
    const emptyReport = {schemaVersion:1, reportType:"snapshot", header:{rootTitle:"Empty report"}, entries:[], folderSizes:{}, warnings:[]};
    let report = emptyReport;
    try { report = JSON.parse(document.getElementById("foldersnap-data").textContent); } catch (_) {}
    const isComparison = report.reportType === "comparison";
    const controls = {
      search: document.getElementById("search"), filter: document.getElementById("filter"),
      sort: document.getElementById("sort"), direction: document.getElementById("direction")
    };
    controls.filter.hidden = !isComparison;
    const treeElement = document.getElementById("tree");
    const warningElement = document.getElementById("warnings");
    const titleElement = document.getElementById("title");
    const summaryElement = document.getElementById("summary");

    function text(parent, value, className) {
      const element = document.createElement("span");
      if (className) element.className = className;
      element.textContent = value == null ? "" : String(value);
      parent.appendChild(element);
      return element;
    }
    function statusLabel(status) {
      return ({added:"Added", removed:"Deleted", modified:"Modified", uncertain:"Warning", scope_difference:"Scope difference"})[status] || "";
    }
    function typeLabel(type) { return ({file:"File", directory:"Folder", reparse:"Link", other:"Other"})[type] || "Folder"; }
    function formatBytes(value) {
      if (value == null || value === "") return "—";
      try {
        const bytes = BigInt(value), units = ["B","KB","MB","GB","TB","PB"];
        let divisor = 1n, unit = 0;
        while (unit < units.length - 1 && bytes >= divisor * 1024n) { divisor *= 1024n; unit++; }
        if (unit === 0) return bytes + " B";
        const tenths = (bytes * 10n + divisor / 2n) / divisor;
        return (tenths / 10n) + "." + (tenths % 10n) + " " + units[unit];
      } catch (_) { return String(value) + " B"; }
    }
    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      return Number.isNaN(date.valueOf()) ? "—" : date.toLocaleString();
    }
    function createTree(entries) {
      const root = {path:"", name:"", children:new Map(), data:null, depth:-1};
      for (const entry of entries || []) {
        const parts = String(entry.path || "").split("/").filter(Boolean);
        let parent = root, path = "";
        parts.forEach((part, index) => {
          path = path ? path + "/" + part : part;
          if (!parent.children.has(part)) parent.children.set(part, {path, name:part, children:new Map(), data:null, depth:index});
          parent = parent.children.get(part);
        });
        if (parts.length) parent.data = entry;
      }
      return root;
    }
    function metadata(node) {
      if (!node.data) return {};
      if (!isComparison) return node.data;
      const after = node.data.after;
      return after && Object.keys(after).length ? after : (node.data.before || {});
    }
    function isFolder(node) { return metadata(node).type === "directory" || node.children.size > 0; }
    function displayName(node) {
      const display = metadata(node).displayPath || node.data?.displayPath || node.path;
      return String(display).split(/[\\/]/).pop() || node.name;
    }
    function nodeStatus(node) { return isComparison && node.data ? node.data.change || "" : ""; }
    function sizeValue(node) {
      if (isFolder(node) && report.folderSizes && report.folderSizes[node.path]) {
        const sizes = report.folderSizes[node.path];
        if (isComparison) return sizes.afterPresent ? sizes.afterBytes : sizes.beforeBytes;
        return sizes.sizeBytes || "0";
      }
      return metadata(node).sizeBytes || "0";
    }
    function createdValue(node) { return metadata(node).createdAtUtc || ""; }
    function matches(node, query, filter) {
      const status = nodeStatus(node);
      const filterMatch = filter === "all" || status === filter || (filter === "warning" && (status === "uncertain" || status === "scope_difference"));
      if (!filterMatch) return false;
      const haystack = (displayName(node) + " " + node.path + " " + (metadata(node).displayPath || "")).toLocaleLowerCase();
      return !query || haystack.includes(query);
    }
    function visibleNodes(root, query, filter) {
      const visible = new Set();
      function visit(node) {
        let shown = node.path !== "" && matches(node, query, filter);
        for (const child of node.children.values()) shown = visit(child) || shown;
        if (shown && node.path !== "") visible.add(node);
        return shown;
      }
      visit(root);
      return visible;
    }
    function compareNodes(left, right) {
      const field = controls.sort.value, direction = controls.direction.value === "asc" ? 1 : -1;
      if (isFolder(left) !== isFolder(right)) return isFolder(left) ? -1 : 1;
      let result = 0;
      if (field === "size") {
        try { const a=BigInt(sizeValue(left)||0), b=BigInt(sizeValue(right)||0); result = a < b ? -1 : a > b ? 1 : 0; } catch (_) {}
      } else if (field === "created") {
        result = String(createdValue(left)).localeCompare(String(createdValue(right)));
      } else {
        result = displayName(left).localeCompare(displayName(right), undefined, {numeric:true, sensitivity:"base"});
      }
      if (result === 0) result = left.path.localeCompare(right.path, undefined, {sensitivity:"base"});
      return result * direction;
    }
    function addRow(container, node) {
      container.classList.add("row");
      const status = nodeStatus(node);
      if (status === "added" || status === "removed" || status === "modified") container.classList.add("status-" + status);
      if (status === "uncertain" || status === "scope_difference") container.classList.add("status-warning");
      const nameCell = document.createElement("span"); nameCell.className = "name";
      text(nameCell, displayName(node)); text(nameCell, node.path, "path"); container.appendChild(nameCell);
      text(container, typeLabel(metadata(node).type || (isFolder(node) ? "directory" : "other")), "meta type");
      if (isComparison) {
        const folderSizes = isFolder(node) && report.folderSizes ? report.folderSizes[node.path] : null;
        const before = folderSizes ? (folderSizes.beforePresent ? folderSizes.beforeBytes : null) : node.data?.before?.sizeBytes;
        const after = folderSizes ? (folderSizes.afterPresent ? folderSizes.afterBytes : null) : node.data?.after?.sizeBytes;
        const size = before != null || after != null ? formatBytes(before) + " → " + formatBytes(after) : formatBytes(sizeValue(node));
        text(container, size, "meta size");
      } else text(container, formatBytes(sizeValue(node)), "meta size");
      const created = createdValue(node);
      const date = text(container, formatDate(created), "meta date");
      if (created) date.dataset.utc = created;
      if (status) text(container, statusLabel(status), "badge");
    }
    function renderNode(node, visible, query) {
      if (!visible.has(node)) return null;
      if (isFolder(node)) {
        const details = document.createElement("details"); details.open = Boolean(query) || node.depth < 1;
        const summary = document.createElement("summary"); addRow(summary, node); details.appendChild(summary);
        const children = document.createElement("div"); children.className = "children";
        [...node.children.values()].filter(child => visible.has(child)).sort(compareNodes).forEach(child => {
          const rendered = renderNode(child, visible, query); if (rendered) children.appendChild(rendered);
        });
        details.appendChild(children); return details;
      }
      const row = document.createElement("div"); addRow(row, node); return row;
    }
    const root = createTree(report.entries || []);
    function render() {
      const query = controls.search.value.trim().toLocaleLowerCase(), filter = controls.filter.value;
      const visible = visibleNodes(root, query, filter), fragment = document.createDocumentFragment();
      [...root.children.values()].filter(node => visible.has(node)).sort(compareNodes).forEach(node => {
        const rendered = renderNode(node, visible, query); if (rendered) fragment.appendChild(rendered);
      });
      treeElement.replaceChildren(fragment);
      if (!visible.size) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent="No entries match this view."; treeElement.appendChild(empty); }
      summaryElement.textContent = visible.size + " visible entries";
    }
    let debounce;
    controls.search.addEventListener("input", () => { clearTimeout(debounce); debounce=setTimeout(render,160); });
    controls.filter.addEventListener("change", render); controls.sort.addEventListener("change", render); controls.direction.addEventListener("change", render);
    function reportTitle() {
      const title = String(report.header?.rootTitle || "").trim();
      if (title && title.toLocaleLowerCase() !== "unknown") return title;
      const rootPath = String(report.header?.rootPath || "").replace(/[\\/]+$/, "");
      return rootPath.split(/[\\/]/).pop() || "FolderSnap report";
    }
    titleElement.textContent = reportTitle();
    document.title = titleElement.textContent + " · FolderSnap";
    for (const warning of report.warnings || []) {
      const row=document.createElement("div"); row.className="warning"; row.textContent=(warning.path || "Root") + " · " + (warning.message || "Scan warning"); warningElement.appendChild(row);
    }
    warningElement.hidden = !(report.warnings || []).length;
    render();
  </script>
</body>
</html>
